<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients for the folded 'A' ribbon logo -->
    <linearGradient id="leftRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003cd2" />
      <stop offset="60%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="rightLeg" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#002bb0" />
      <stop offset="100%" stop-color="#00a0ff" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#00bfff" />
    </linearGradient>
    
    <!-- Filter for realistic drop shadow of fold overlap -->
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Subtle dark canvas container background -->
  <rect width="512" height="512" rx="128" fill="#08070d" />
  
  <!-- Logo container group -->
  <g transform="translate(24, 24)">
    <!-- Right Leg (Behind) -->
    <path d="M 256 120 C 290 120, 335 155, 355 200 L 382 260 C 394 285, 396 310, 396 335 C 396 355, 385 365, 365 365 C 345 365, 332 345, 322 325 C 310 300, 284 240, 276 220 L 268 120 Z" fill="url(#rightLeg)" />
    
    <!-- Left Ribbon and Top Arch (Front with Shadow overlay) -->
    <path d="M 148 365 C 135 365, 128 350, 136 333 L 222 165 C 235 140, 256 120, 278 120 C 302 120, 322 135, 338 155 C 350 170, 356 190, 360 208 C 362 216, 357 224, 349 227 L 297 245 C 287 248, 278 241, 275 231 C 271 216, 260 205, 252 205 C 242 205, 232 220, 225 235 L 172 338 C 168 346, 160 365, 148 365 Z" fill="url(#leftRibbon)" filter="url(#foldShadow)" />
    
    <!-- Inner Rounded Triangle Arrow -->
    <path d="M 230 310 C 220 310, 220 298, 226 288 L 246 253 C 251 245, 261 245, 266 253 L 286 288 C 292 298, 292 310, 282 310 Z" fill="url(#arrowGrad)" />
    
    <!-- Dispersing pixel squares in top-right -->
    <rect x="345" y="110" width="20" height="20" rx="5" fill="#00f0ff" />
    <rect x="375" y="80" width="20" height="20" rx="5" fill="#00f0ff" />
    <rect x="345" y="145" width="22" height="22" rx="5" fill="#00a0ff" />
    <rect x="380" y="125" width="16" height="16" rx="4" fill="#00d5ff" />
    <rect x="375" y="170" width="20" height="20" rx="5" fill="#002bb0" />
    <rect x="410" y="105" width="14" height="14" rx="4" fill="#00f0ff" />
    <rect x="410" y="135" width="18" height="18" rx="4" fill="#00d5ff" />
    <rect x="425" y="70" width="16" height="16" rx="4" fill="#00ffcc" />
    <rect x="435" y="115" width="12" height="12" rx="3" fill="#00f0ff" />
  </g>
</svg>
